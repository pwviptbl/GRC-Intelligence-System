name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Testes (PHP 8.5 + PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        # O arquivo artisan força DB_HOST=127.0.0.1 e DB_PORT=5433 fora do Docker (porta exposta pelo Sail),
        # então o Postgres da CI é publicado na 5433 para casar com esse padrão.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, zip, gd, intl, mbstring, bcmath
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # As views usam @vite: os testes precisam do manifest gerado pelo build.
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - run: php artisan test

  pint:
    name: Estilo de código (Pint, informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informativo até a base ser formatada: há arquivos fora do padrão anteriores à CI.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: ./vendor/bin/pint --test
