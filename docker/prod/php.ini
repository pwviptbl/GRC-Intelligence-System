; Limites alinhados ao uso do sistema (PDFs, backups e importação de scans).
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 100M
post_max_size = 100M
variables_order = EGPCS
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; O código é atualizado por git pull no volume: revalidar arquivos alterados.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
