[www]
; Dimensionado para o LXC com 2 GB de RAM (cada worker usa ~40-80 MB).
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 300
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
