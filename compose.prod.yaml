# Override de produção: Nginx + PHP-FPM no lugar do `artisan serve` do Sail.
# Ativado no servidor via COMPOSE_FILE=compose.yaml:compose.prod.yaml no .env.
# Sem essa variável (ambiente de desenvolvimento), o Sail continua como antes.

# Logs dos containers com limite (padrão do Docker é crescer sem limite).
x-logging: &default-logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '5'

services:
    laravel.test:
        profiles: ['dev']

    scheduler:
        depends_on: !reset
            - pgsql
            - redis
        restart: unless-stopped
        logging: *default-logging

    php:
        build:
            context: ./docker/prod
        image: 'grc-php-fpm:8.5'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        restart: unless-stopped
        logging: *default-logging

    web:
        image: 'nginx:1.28-alpine'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './docker/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
            - '.:/var/www/html:ro'
        networks:
            - sail
        depends_on:
            - php
        restart: unless-stopped
        logging: *default-logging
        # /up passa por Nginx -> PHP-FPM -> Laravel: cobre a pilha web inteira.
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/up']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

    pgsql:
        restart: unless-stopped
        logging: *default-logging

    redis:
        restart: unless-stopped
        logging: *default-logging
